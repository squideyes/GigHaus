name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: >
          dotnet restore GigHaus.AppHost &&
          dotnet restore GigHaus.WebApi &&
          dotnet restore GigHaus.Web &&
          dotnet restore GigHaus.Migrations &&
          dotnet restore GigHaus.Tests

      - name: Build
        run: >
          dotnet build GigHaus.AppHost --no-restore &&
          dotnet build GigHaus.WebApi --no-restore &&
          dotnet build GigHaus.Web --no-restore &&
          dotnet build GigHaus.Migrations --no-restore &&
          dotnet build GigHaus.Tests --no-restore

      - name: Test
        run: dotnet test GigHaus.Tests --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: GigHaus.Tests/TestResults/*.trx

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore GigHaus.WebApi && dotnet restore GigHaus.Tests

      - name: Build with warnings as errors
        run: >
          dotnet build GigHaus.WebApi --no-restore -warnaserror &&
          dotnet build GigHaus.Tests --no-restore -warnaserror

